<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q1 Project - Receipt Generator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url("BG.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
        }

        .navbar {
            background-color: #0d3b66;
            padding: 15px;
            text-align: center;
        }

        .navbar a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }

        .navbar a:hover {
            color: #ffc107;
        }

        .form {
            background-color: #ffc107;
            width: 300px;
            margin: 40px auto;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
        }

        .form-image {
            width: 200px;
            height: auto;
            margin: 10px auto 20px;
            display: block;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-size: 14px;
            font-weight: bold;
            color: #222;
            text-align: left;
        }

        input, select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 12px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #0d3b66;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #092846;
        }

        .result {
            background-color: white;
            padding: 12px;
            margin-top: 15px;
            border-radius: 4px;
            color: #28a745;
            font-weight: bold;
            display: none;
        }

        .success-logo {
            width: 50px;
            height: 50px;
            margin-top: 10px;
        }

        .success {
            color: #28a745;
            font-weight: bold;
            margin-top: 5px;
            margin-bottom: 0;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <a href="index.html">SKU Generator</a>
        <a href="receipt.html">Receipt Generator</a>
    </div>

    <div class="form">

        <h2>Receipt Generator</h2>

        <img src="sample.jpg" alt="SKU Image" class="form-image">

        <label>Item Name:</label>
        <input type="text" id="itemName" placeholder="e.g. Shirt">

        <label>Price:</label>
        <input type="number" id="price" placeholder="e.g. 100">

        <label>Quantity:</label>
        <input type="number" id="quantity" placeholder="e.g. 2">

        <button onclick="generateReceipt()">Generate Receipt</button>

        <div class="result" id="result">
            <h3 id="receiptText"></h3>
            <div id="successMessage">
                <img src="check.jpg" alt="Success Logo" class="success-logo">
                <p class="success">Success!</p>
            </div>

        </div>

    </div>

    <script>
        function generateReceipt() {
            let item = document.getElementById("itemName").value;
            let price = document.getElementById("price").value;
            let quantity = document.getElementById("quantity").value;

            let total = price * quantity;

            document.getElementById("receiptText").textContent =
                "Total for " + quantity + "x " + item + ": $" + total;

            document.getElementById("result").style.display = "block";
        }
    </script>

</body>
</html>
